<!doctype html>
<html>
    <head>
        <title>{{ .Location }} - SuperBom</title>
    </head>
    <body>
        <h1>{{ .Location }}</h1>

        {{ if .IsCached }}
        <span>cached</span>
        {{ else }}
        <span style="color: green">fresh</span>
        {{ end }}

        <ul>
            <li>Temp Now: {{ .TempNow }}</li>
            <li>Feels Like: {{ .FeelsLike }}</li>
            <li>Today High: {{ .TodayHigh }}</li>
            <li>Today Low: {{ .TodayLow }}</li>
        </ul>

        <h2>Other places</h2>
        <ul>
            <a href="/Perth">Perth</a>
            <a href="/Sydney">Sydney</a>
            <a href="/Melbourne">Melbourne</a>
            <a href="/Brisbane">Brisbane</a>
            <a href="/Adelaide">Adelaide</a>
            <a href="/Hobart">Hobart</a>
            <a href="/Darwin">Darwin</a>
            <a href="/Canberra">Canberra</a>
        </ul>
    </body>
</html>
