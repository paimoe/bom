{{ define "base" }}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>bom</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Pridi:wght@200;300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/static/main.css" />

        <style>
            :root{
                --blue: #001427ff;
                --teal: #708d81ff;
                --jasmine: #f4d58dff;
                --ember: #bf0603ff;
                --red: #8d0801ff;
            }
            #topper {
                height: 10px;
                background: repeating-linear-gradient(to right,var(--blue) 0,var(--blue) 50px,var(--teal) 50px,var(--teal) 100px,var(--jasmine) 100px,var(--jasmine) 150px,var(--ember) 150px,var(--ember) 200px,var(--red) 200px,var(--red) 250px);
            }
            .city-list {
                display: flex;
                flex-wrap: wrap;
                justify-content: flex-start;
                gap: 1rem 2rem;
                list-style: none;
                padding: 1rem 0 2rem 0;
                margin: 0;
            }
            .hero-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 1rem;
            }
        </style>
    </head>
    <div id="topper"></div>
    <body>
        <nav class="navbar is-dark" role="navigation" aria-label="main navigation">
            <div class="navbar-brand">
                <a class="navbar-item" href="/">
                    <strong>home</strong>
                </a>
            </div>
        </nav>

        <section class="section">
            <div class="container">
                {{ template "main" .}}
            </div>
        </section>

        <footer class="footer" style="background: #262626; color: #fff; padding: 1.5rem; text-align: center;">
            Cached for 20 minutes.
        </footer>
    </body>
</html>

{{ end }}
