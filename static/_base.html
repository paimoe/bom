{{ define "base" }}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>bom</title>
        <link
            rel="stylesheet"
            href="https://assets.ubuntu.com/v1/vanilla_framework_version_4_38_0_min.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Pridi:wght@200;300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/static/main.css" />

        <style>
            html, body {
                margin: 0;
                height: 100%;
            }
            .l-docs {
                min-height: 100vh;
            }
            @media (max-width: 1035px) {
                .l-docs {
                    display: flex;
                    flex-direction: column;
                }
                .l-docs__main {
                    flex: 1;
                }
            }
            .city-list {
                display: flex;
                flex-wrap: wrap;
                justify-content: flex-start;
                gap: 1rem 2rem;
                list-style: none;
                padding: 1rem 0 2rem 0;
                margin: 0;
            }
            .hero-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 1rem;
            }
            .hero-bar h1 {
                margin: 0;
            }
            :root{
            --blue: #001427ff;
            --teal: #708d81ff;
            --jasmine: #f4d58dff;
            --ember: #bf0603ff;
            --red: #8d0801ff;
            }
            #topper {
                height: 10px;
  background: repeating-linear-gradient(to right,var(--blue) 0,var(--blue) 50px,var(--teal) 50px,var(--teal) 100px,var(--jasmine) 100px,var(--jasmine) 150px,var(--ember) 150px,var(--ember) 200px,var(--red) 200px,var(--red) 250px);
            }
            .hero {
                margin: 2em 0;
            }
            .hero h1 {
                font-size: 300%;
            }
            h2 {
                font-size: 200%;
            }
            .temperatures table tr td:first-child {
                font-weight: bold;
                width: 15%;
            }
            .site-footer {
                background: #262626;
                color: #fff;
                padding: 1.5rem;
                text-align: center;
                grid-area: footer;
                min-height: 200px;
                line-height: 200px;
            }
        </style>
    </head>
    <div id="topper"></div>
    <body class="is-paper">
        <div class="l-docs">
            <div class="l-docs__header">
                <header id="navigation" class="p-navigation is-dark">
                    <div class="l-docs__subgrid">
                        <div class="l-docs__main">
                        </div>
                    </div>
                </header>
            </div>

            <main class="l-docs__main">
                <div class="row">
                    <div class="col-12">{{ template "main" .}}</div>
                </div>
            </main>

            <footer class="site-footer">
                Cached for 20 minutes.
            </footer>
        </div>
    </body>
</html>

{{ end }}
